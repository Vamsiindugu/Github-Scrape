[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "github-scrape-project"
version = "0.2.0"
description = "Browse, search, and download files from GitHub repos in your terminal."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "Vamsi Indugu" }]
dependencies = [
    "typer[all]>=0.15.0",
    "textual>=0.90.0",
    "httpx>=0.28.0",
    "rapidfuzz>=3.10.0",
    "platformdirs>=4.3.0",
    "tomlkit>=0.13.0",
    "rich>=13.9.0",
]

[project.scripts]
github-scrape = "github_scrape.cli:app"

[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "LICENSE", "pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["src/github_scrape"]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.25.0", "pytest-cov>=6.0.0", "respx>=0.22.0", "mypy>=1.14.0", "ruff>=0.9.0"]
[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "TCH"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
